name: Push image to Docker Hub

permissions:
  contents: write

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Derive Jena version
        id: version
        run: |
          version=$(python3 -c "import re; t=open('pom.xml').read(); m=re.search(r'<artifactId>jena-fuseki-docker</artifactId>\s*<version>([^<]+)</version>', t); print(m.group(1))")
          echo "full=$version" >> "$GITHUB_OUTPUT"
          echo "major=${version%%.*}" >> "$GITHUB_OUTPUT"
          echo "Building Apache Jena Fuseki $version"

      - name: Download Apache jena-fuseki-docker recipe
        run: |
          v="${{ steps.version.outputs.full }}"
          curl -fsSL -o /tmp/recipe.zip \
            "https://repo1.maven.org/maven2/org/apache/jena/jena-fuseki-docker/${v}/jena-fuseki-docker-${v}.zip"
          mkdir -p build
          unzip -q /tmp/recipe.zip -d build/
          mv "build/jena-fuseki-docker-${v}" build/recipe

      - uses: docker/build-push-action@v7
        with:
          context: build/recipe
          build-args: |
            JENA_VERSION=${{ steps.version.outputs.full }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            netwerkdigitaalerfgoed/fuseki:${{ steps.version.outputs.full }}
            netwerkdigitaalerfgoed/fuseki:${{ steps.version.outputs.major }}
            netwerkdigitaalerfgoed/fuseki:latest

      # Companion image with the Apache Jena CLI tools (tdb2.xloader, jena.textindexer, …)
      # for loader/batch jobs. Built from the SAME Jena version as the server image
      # above, so the TDB2 / Lucene formats it writes always match what Fuseki reads.
      - name: Build and push jena-tools (CLI tools image)
        uses: docker/build-push-action@v7
        with:
          context: jena-tools
          build-args: |
            JENA_VERSION=${{ steps.version.outputs.full }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            netwerkdigitaalerfgoed/jena-tools:${{ steps.version.outputs.full }}
            netwerkdigitaalerfgoed/jena-tools:${{ steps.version.outputs.major }}
            netwerkdigitaalerfgoed/jena-tools:latest

      - name: Create GitHub release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes || true
        env:
          VERSION: ${{ steps.version.outputs.full }}
          GH_TOKEN: ${{ github.token }}
